<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KPJ Bulk Validator</title>
<style>
  :root {
    --primary: #0d6efd; --primary-dark: #0b5ed7; --success: #198754; --danger: #dc3545;
    --warning: #ffc107; --info: #0dcaf0; --light: #f8f9fa; --dark: #212529;
    --gray: #6c757d; --gray-light: #e9ecef; --card-bg: #ffffff; --body-bg: #f0f2f5;
    --shadow: 0 2px 8px rgba(0,0,0,0.08); --shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
    --radius: 12px; --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: var(--font); background: var(--body-bg); color: var(--dark); min-height: 100vh; padding-bottom: 20px; -webkit-font-smoothing: antialiased; }
  .header { background: linear-gradient(135deg, var(--primary) 0%, #1a53ff 100%); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-stats { display: flex; gap: 16px; font-size: 12px; opacity: 0.9; }
  .header-stat { display: flex; align-items: center; gap: 4px; }
  .header-stat .num { font-weight: 700; font-size: 14px; }
  .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: #fff; border-radius: 2px; transition: width 0.4s ease; width: 0%; }
  .upload-section { padding: 16px 20px; background: var(--card-bg); margin: 12px 16px; border-radius: var(--radius); box-shadow: var(--shadow); }
  .upload-area { border: 2px dashed var(--gray-light); border-radius: var(--radius-sm); padding: 28px 16px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--light); }
  .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background: #e7f0ff; }
  .upload-area svg { width: 40px; height: 40px; color: var(--primary); margin-bottom: 8px; }
  .upload-area p { font-size: 13px; color: var(--gray); }
  .upload-area .btn-text { color: var(--primary); font-weight: 600; }
  .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .file-chip { display: flex; align-items: center; gap: 8px; background: var(--light); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12px; flex-wrap: wrap; }
  .file-chip .fname { flex: 1; font-weight: 500; min-width: 0; }
  .file-chip .fsize { color: var(--gray); white-space: nowrap; }
  .file-chip .fstatus { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .fstatus.done { background: #d1f2e1; color: var(--success); }
  .fstatus.processing { background: #fff3cd; color: var(--warning); }
  .fstatus.failed { background: #f8d7da; color: var(--danger); }
  .file-chip .remove { color: var(--danger); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .file-chip .error-detail { width: 100%; font-size: 10px; color: var(--danger); margin-top: 4px; padding-top: 4px; border-top: 1px dashed #f5c6cb; }
  .toolbar { padding: 0 16px; display: flex; gap: 8px; margin-bottom: 12px; }
  .search-box { flex: 1; position: relative; }
  .search-box input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--gray-light); border-radius: var(--radius-sm); font-size: 14px; outline: none; transition: border 0.2s; }
  .search-box input:focus { border-color: var(--primary); }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--gray); }
  .filter-btn { padding: 10px 14px; border: 1px solid var(--gray-light); background: white; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .cards-container { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; animation: fadeInUp 0.3s ease both; }
  .card:active { transform: scale(0.98); }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--gray-light); display: flex; justify-content: space-between; align-items: flex-start; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--dark); line-height: 1.3; }
  .card-sub { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .card-badge { font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .badge-green { background: #d1f2e1; color: var(--success); }
  .badge-blue { background: #cce5ff; color: var(--primary-dark); }
  .badge-orange { background: #ffe5cc; color: #e67e00; }
  .badge-red { background: #f8d7da; color: var(--danger); }
  .card-body { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field.full { grid-column: 1 / -1; }
  .field-label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }
  .field-value { font-size: 13px; font-weight: 500; color: var(--dark); word-break: break-word; }
  .field-value.large { font-size: 16px; font-weight: 700; color: var(--primary-dark); }
  .copy-row { display: flex; align-items: center; gap: 8px; }
  .copy-btn { padding: 3px 10px; border: 1px solid var(--primary); color: var(--primary); background: transparent; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .copy-btn:active { background: var(--primary); color: white; }
  .copy-btn.copied { background: var(--success); border-color: var(--success); color: white; }
  .fallback-section { grid-column: 1 / -1; margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--gray-light); }
  .fallback-btn-card { width: 100%; padding: 10px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: linear-gradient(135deg, var(--primary) 0%, #1a53ff 100%); color: white; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .fallback-btn-card:active { opacity: 0.85; transform: scale(0.98); }
  .fallback-btn-card.copied { background: var(--success); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--dark); color: white; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; transition: all 0.3s ease; pointer-events: none; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
  .empty-state svg { width: 64px; height: 64px; color: var(--gray-light); margin-bottom: 16px; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--dark); }
  .empty-state p { font-size: 13px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal-sheet { background: white; width: 100%; max-height: 80vh; border-radius: var(--radius) var(--radius) 0 0; padding: 16px 0; animation: slideUp 0.25s ease; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { padding: 0 20px 12px; border-bottom: 1px solid var(--gray-light); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-size: 16px; }
  .modal-close { font-size: 24px; color: var(--gray); cursor: pointer; background: none; border: none; }
  .modal-body { padding: 12px 20px; }
  .modal-item { padding: 12px 0; border-bottom: 1px solid var(--gray-light); display: flex; justify-content: space-between; align-items: center; }
  .modal-item:last-child { border-bottom: none; }
  .modal-item-label { font-size: 13px; color: var(--gray); }
  .modal-item-value { font-size: 14px; font-weight: 600; }
  .progress-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 300; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .progress-overlay.show { display: flex; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--gray-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-overlay p { font-size: 14px; color: var(--gray); }
  #fileInput { display: none; }
  .kabupaten-tag { display: inline-block; background: #e7f0ff; color: var(--primary-dark); padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .stats-row { display: flex; gap: 12px; padding: 0 16px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat-pill { background: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px; }
  .stat-pill .num { font-weight: 700; color: var(--primary); }
  .batch-progress { padding: 0 16px; margin-bottom: 12px; display: none; }
  .batch-progress.show { display: block; }
  .batch-progress-bar { width: 100%; height: 6px; background: var(--gray-light); border-radius: 3px; overflow: hidden; }
  .batch-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #1a53ff); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
  .batch-progress-text { font-size: 12px; color: var(--gray); margin-top: 6px; text-align: center; }
  .debug-panel { padding: 0 16px; margin-bottom: 12px; display: none; }
  .debug-panel.show { display: block; }
  .debug-panel h4 { font-size: 13px; color: var(--danger); margin-bottom: 8px; }
  .debug-log { background: #fff8f8; border: 1px solid #f5c6cb; border-radius: 8px; padding: 10px 12px; font-size: 11px; font-family: monospace; color: var(--danger); max-height: 300px; overflow-y: auto; }
  .debug-log .log-entry { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px dashed #f5c6cb; }
  .debug-log .log-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  @media (min-width: 768px) {
    .cards-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .upload-section, .toolbar, .stats-row, .batch-progress, .debug-panel { max-width: 1200px; margin-left: auto; margin-right: auto; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>KPJ Bulk Validator</h1>
    <div class="header-stats">
      <div class="header-stat"><span class="num" id="statTotal">0</span> Total</div>
      <div class="header-stat"><span class="num" id="statValid">0</span> Valid</div>
      <div class="header-stat"><span class="num" id="statDup">0</span> Duplikat</div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="upload-section">
  <div class="upload-area" id="uploadArea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>Klik atau seret file Excel (.xlsx / .xls) ke sini</p>
    <p class="btn-text">Pilih File</p>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple>
  <div class="file-list" id="fileList"></div>
</div>

<div class="batch-progress" id="batchProgress">
  <div class="batch-progress-bar"><div class="batch-progress-fill" id="batchProgressFill"></div></div>
  <div class="batch-progress-text" id="batchProgressText">Memproses 0 dari 0 file...</div>
</div>

<div class="debug-panel" id="debugPanel">
  <h4>Debug Log</h4>
  <div class="debug-log" id="debugLog"></div>
</div>

<div class="stats-row" id="statsRow" style="display:none;">
  <div class="stat-pill"><span class="num" id="pillTotal">0</span> Total Masuk</div>
  <div class="stat-pill"><span class="num" id="pillValid">0</span> Valid</div>
  <div class="stat-pill"><span class="num" id="pillDup">0</span> NIK Duplikat</div>
  <div class="stat-pill"><span class="num" id="pillRemoved">0</span> Dihapus</div>
</div>

<div class="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Cari nama, NIK, KPJ...">
  </div>
  <button class="filter-btn" id="sortBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="21" y1="10" x2="3" y2="10"/><line x1="18" y1="6" x2="6" y2="6"/><line x1="15" y1="14" x2="3" y2="14"/><line x1="12" y1="18" x2="3" y2="18"/>
    </svg>
    <span id="sortLabel">Terbaru</span>
  </button>
</div>

<div class="cards-container" id="cardsContainer">
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
    </svg>
    <h3>Belum ada data</h3>
    <p>Upload file Excel untuk memulai validasi data KPJ</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-header">
      <h3>Detail Lengkap</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="progress-overlay" id="progressOverlay">
  <div class="spinner"></div>
  <p id="progressText">Memproses file...</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
var allData = [];
var filteredData = [];
var sortOrder = 'desc';
var dupRemovedCount = 0;
var isProcessing = false;
var fileQueue = [];
var queueIndex = 0;
var debugLogs = [];

function logDebug(msg) {
  debugLogs.push(msg);
  var panel = document.getElementById('debugPanel');
  var logDiv = document.getElementById('debugLog');
  if (panel) panel.classList.add('show');
  if (logDiv) {
    var entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
  }
  console.log('[KPJ]', msg);
}

function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

function escapeJsString(text) {
  if (!text) return '';
  return String(text)
    .replace(/\\/g, '\\\\')
    .replace(/`/g, '\\`')
    .replace(/\$/g, '\\$')
    .replace(/"/g, '\\"')
    .replace(/'/g, "\\'");
}

document.addEventListener('DOMContentLoaded', function() {
  try {
    var saved = localStorage.getItem('kpjData');
    var savedDup = localStorage.getItem('kpjDupCount');
    if (saved) {
      allData = JSON.parse(saved);
      filteredData = allData.slice();
      dupRemovedCount = parseInt(savedDup || '0', 10) || 0;
      renderCards();
      updateStats();
    }
  } catch(e) {
    console.error('Restore failed', e);
  }

  document.getElementById('uploadArea').addEventListener('click', function() {
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', function(e) {
    handleFiles(e.target.files);
    this.value = '';
  });

  var uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', function() { uploadArea.classList.remove('dragover'); });
  uploadArea.addEventListener('drop', function(e) { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });

  document.getElementById('searchInput').addEventListener('input', filterData);
  document.getElementById('sortBtn').addEventListener('click', toggleSort);
  document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
});

function handleFiles(files) {
  if (!files || files.length === 0) return;
  if (isProcessing) {
    showToast('Masih memproses file sebelumnya, silakan tunggu...');
    return;
  }

  var validFiles = [];
  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    if (!file.name.match(/\.(xlsx|xls)$/i)) {
      showToast('Dilewati: ' + file.name + ' (bukan file Excel)');
      logDebug('Dilewati: ' + file.name);
    } else {
      validFiles.push(file);
    }
  }

  if (validFiles.length === 0) return;

  fileQueue = validFiles;
  queueIndex = 0;
  isProcessing = true;

  document.getElementById('batchProgress').classList.add('show');
  updateBatchProgress();
  processNextFile();
}

function updateBatchProgress() {
  var pct = fileQueue.length > 0 ? ((queueIndex / fileQueue.length) * 100) : 0;
  document.getElementById('batchProgressFill').style.width = pct + '%';
  document.getElementById('batchProgressText').textContent = 'Memproses ' + queueIndex + ' dari ' + fileQueue.length + ' file...';
}

function setChipStatus(chip, status, text) {
  try {
    var el = chip.querySelector('.fstatus');
    if (!el) {
      el = document.createElement('span');
      el.className = 'fstatus';
      chip.appendChild(el);
    }
    el.className = 'fstatus ' + status;
    el.textContent = text;
  } catch(e) {
    console.error('setChipStatus error:', e);
  }
}

function addChipError(chip, msg) {
  try {
    var existing = chip.querySelector('.error-detail');
    if (existing) existing.remove();
    var detail = document.createElement('span');
    detail.className = 'error-detail';
    detail.textContent = String(msg).substring(0, 200);
    chip.appendChild(detail);
  } catch(e) {
    console.error('addChipError error:', e);
  }
}

function processNextFile() {
  if (queueIndex >= fileQueue.length) {
    isProcessing = false;
    document.getElementById('batchProgress').classList.remove('show');
    var msg = 'Selesai! ' + allData.length + ' data valid dari ' + fileQueue.length + ' file';
    if (dupRemovedCount > 0) msg += ', ' + dupRemovedCount + ' duplikat dihapus';
    showToast(msg);
    logDebug(msg);
    return;
  }

  var file = fileQueue[queueIndex];
  var fileList = document.getElementById('fileList');

  var chip = document.createElement('div');
  chip.className = 'file-chip';
  chip.id = 'chip-' + queueIndex;
  chip.innerHTML =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0d6efd" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>' +
    '<span class="fname">' + escapeHtml(file.name) + '</span>' +
    '<span class="fsize">' + (file.size / 1024).toFixed(1) + ' KB</span>' +
    '<span class="fstatus processing">Memproses...</span>' +
    '<span class="remove" onclick="this.parentElement.remove()">&times;</span>';
  fileList.appendChild(chip);

  logDebug('Memulai: ' + file.name + ' (' + file.size + ' bytes)');

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      logDebug('File dibaca: ' + file.name + ', size: ' + e.target.result.byteLength + ' bytes');
      var data = new Uint8Array(e.target.result);
      var workbook;
      try {
        workbook = XLSX.read(data, { type: 'array', cellDates: true });
      } catch (xlsErr) {
        logDebug('Retry binary untuk: ' + file.name);
        workbook = XLSX.read(data, { type: 'binary', cellDates: true });
      }
      logDebug('Sheet: ' + workbook.SheetNames.join(', '));

      var sheet = workbook.Sheets[workbook.SheetNames[0]];
      var jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      logDebug('Rows: ' + jsonData.length + ', Cols: ' + (jsonData[0] ? jsonData[0].length : 0));

      if (jsonData.length > 0) {
        logDebug('Headers: ' + JSON.stringify(jsonData[0].slice(0, 15)));
      }

      var result = processExcelData(jsonData, file.name);

      setChipStatus(chip, 'done', 'Selesai (+' + result.added + ')');
      logDebug('OK: ' + file.name + ' -> +' + result.added + ', dup:' + result.dupSkipped);
    } catch (err) {
      console.error('Error processing file:', file.name, err);
      var errMsg = err.message || String(err);
      logDebug('ERROR ' + file.name + ': ' + errMsg);
      setChipStatus(chip, 'failed', 'Gagal');
      addChipError(chip, errMsg);
      showToast('Gagal: ' + file.name);
    }

    queueIndex++;
    updateBatchProgress();
    setTimeout(processNextFile, 50);
  };

  reader.onerror = function() {
    logDebug('ERROR read ' + file.name + ': ' + (reader.error ? reader.error.message : 'unknown'));
    setChipStatus(chip, 'failed', 'Gagal');
    addChipError(chip, 'Gagal membaca file');
    showToast('Gagal membaca: ' + file.name);
    queueIndex++;
    updateBatchProgress();
    setTimeout(processNextFile, 50);
  };

  reader.readAsArrayBuffer(file);
}

function processExcelData(rows, filename) {
  if (!rows || rows.length < 2) {
    logDebug(filename + ': Hanya ' + (rows ? rows.length : 0) + ' baris');
    return { added: 0, dupSkipped: 0 };
  }

  var headers = [];
  for (var h = 0; h < rows[0].length; h++) {
    headers.push(String(rows[0][h] || '').trim());
  }
  logDebug(filename + ': Headers = ' + JSON.stringify(headers));

  var colMap = {};
  headers.forEach(function(h, i) { colMap[h] = i; });

  // Mapping kolom yang fleksibel - mendukung berbagai format file
  var altMap = {
    'Detail LASIK': ['detail lasik', 'lasik', 'status lasik', 'keterangan lasik', 'ket lasik', 'status'],
    'Jamsostek Mobile': ['jamsostek mobile', 'jmo', 'mobile', 'status jmo', 'ket jmo', 'detail'],
    'KPJ': ['kpj', 'no kpj', 'nomor kpj', 'no. kpj'],
    'NIK': ['nik', 'no nik', 'nomor nik', 'no. nik'],
    'Nama': ['nama', 'name', 'nama lengkap', 'nama peserta'],
    'Tanggal Lahir': ['tanggal lahir', 'tgl lahir', 'birth date', 'tgl. lahir', 'lahir'],
    'Alamat': ['alamat', 'address', 'perusahaan', 'company', 'nama perusahaan'],
    'Total Saldo': ['total saldo', 'saldo', 'saldo total'],
    'Jumlah Kartu': ['jumlah kartu', 'kartu', 'jml kartu'],
    'Tanggal Nonaktif': ['tanggal nonaktif', 'tgl nonaktif', 'nonaktif']
  };

  for (var std in altMap) {
    if (std in colMap) continue;
    var alts = altMap[std];
    for (var a = 0; a < alts.length; a++) {
      for (var hi = 0; hi < headers.length; hi++) {
        if (headers[hi].toLowerCase().indexOf(alts[a]) !== -1) {
          colMap[std] = hi;
          logDebug(filename + ': Map "' + std + '" -> col ' + hi + ' ("' + headers[hi] + '")');
          break;
        }
      }
      if (std in colMap) break;
    }
  }

  var missing = [];
  var required = ['Detail LASIK', 'Jamsostek Mobile', 'KPJ', 'NIK'];
  for (var r = 0; r < required.length; r++) {
    if (!(required[r] in colMap)) missing.push(required[r]);
  }
  if (missing.length > 0) {
    logDebug(filename + ': KOLOM TIDAK DITEMUKAN: ' + missing.join(', '));
    throw new Error('Kolom tidak ditemukan: ' + missing.join(', '));
  }

  // Log sample data
  var sampleLogged = false;
  for (var s = 1; s < Math.min(rows.length, 5); s++) {
    var sampleRow = rows[s];
    if (sampleRow && sampleRow.length > 0) {
      var dLasik = String(sampleRow[colMap['Detail LASIK']] || '');
      var jmoTxt = String(sampleRow[colMap['Jamsostek Mobile']] || '');
      var kpjTxt = String(sampleRow[colMap['KPJ']] || '');
      var nikTxt = String(sampleRow[colMap['NIK']] || '');
      logDebug(filename + ': Sample row ' + s + ' -> KPJ:' + kpjTxt + ' NIK:' + nikTxt + ' LASIK:' + dLasik.substring(0,40) + ' JMO:' + jmoTxt.substring(0,40));
      if (dLasik || jmoTxt || kpjTxt || nikTxt) {
        sampleLogged = true;
        break;
      }
    }
  }
  if (!sampleLogged) {
    logDebug(filename + ': Tidak ada sample data di 5 baris pertama');
  }

  var added = 0;
  var dupSkipped = 0;
  var existingKpj = {};
  var existingNik = {};
  allData.forEach(function(d) {
    existingKpj[d.KPJ] = true;
    existingNik[d.NIK] = true;
  });

  var newItems = [];

  for (var i = 1; i < rows.length; i++) {
    var row = rows[i];
    if (!row || row.length === 0) continue;

    var detailLasik = String(row[colMap['Detail LASIK']] || '');
    var jmo = String(row[colMap['Jamsostek Mobile']] || '');

    // Filter: Detail LASIK harus mengandung "Silahkan Gunakan JMO"
    // DAN Jamsostek Mobile harus mengandung "Silahkan" atau "melanjutkan" atau "JMO"
    var hasLasik = detailLasik.indexOf('Silahkan Gunakan JMO') !== -1;
    var hasJmo = jmo.indexOf('Silahkan') !== -1 || jmo.indexOf('melanjutkan') !== -1 || jmo.indexOf('JMO') !== -1;

    if (!hasLasik || !hasJmo) {
      continue;
    }

    var kpj = String(row[colMap['KPJ']] || '').trim();
    var nik = String(row[colMap['NIK']] || '').trim();

    if (!kpj || !nik) continue;
    if (existingKpj[kpj]) continue;
    if (existingNik[nik]) {
      dupSkipped++;
      continue;
    }

    existingKpj[kpj] = true;
    existingNik[nik] = true;

    var alamatRaw = String(row[colMap['Alamat']] || '');
    var kabupaten = extractKabupaten(alamatRaw);

    var item = {
      KPJ: kpj,
      Nama: String(row[colMap['Nama']] || '').trim(),
      NIK: nik,
      'Jenis Identitas': 'KTP',
      'Tanggal Lahir': String(row[colMap['Tanggal Lahir']] || ''),
      Alamat: kabupaten,
      'Alamat Raw': alamatRaw,
      Perusahaan: '',
      Segmen: '',
      'Tanggal Nonaktif': String(row[colMap['Tanggal Nonaktif']] || ''),
      'Total Saldo': String(row[colMap['Total Saldo']] || ''),
      'Jumlah Kartu': String(row[colMap['Jumlah Kartu']] || ''),
      'Status LASIK': 'LAYAK',
      'Detail LASIK': detailLasik,
      'Jamsostek Mobile': jmo,
      _timestamp: Date.now()
    };

    newItems.push(item);
    added++;
  }

  if (newItems.length > 0) {
    allData = newItems.concat(allData);
    dupRemovedCount += dupSkipped;
    allData.sort(function(a, b) { return b._timestamp - a._timestamp; });
    filteredData = allData.slice();
    saveData();
    renderCards();
    updateStats();
  }

  return { added: added, dupSkipped: dupSkipped };
}

function extractKabupaten(alamat) {
  if (!alamat || alamat === 'ALAMAT TIDAK ADA') return 'TIDAK ADA';
  var up = alamat.toUpperCase();
  var m = up.match(/KAB\.\s*([A-Z\s]+?)(?:,|\s+PROV\.|$)/);
  if (m) return toTitleCase(m[1].trim());
  m = up.match(/KOTA\s+([A-Z\s]+?)(?:,|\s+PROV\.|$)/);
  if (m) return 'KOTA ' + toTitleCase(m[1].trim());
  m = up.match(/KABUPATEN\s+([A-Z\s]+?)(?:,|\s+PROV\.|$)/);
  if (m) return toTitleCase(m[1].trim());
  m = up.match(/([A-Z]+)\s+(?:JAWA\s+(?:TENGAH|BARAT|TIMUR)|SUMATERA\s+(?:UTARA|SELATAN|BARAT)|SULAWESI\s+(?:TENGAH|SELATAN|UTARA)|KALIMANTAN\s+(?:TIMUR|SELATAN|BARAT|UTARA|TENGAH)|BALI|RIAU|LAMPUNG|BANTEN|PAPUA|NTB|NTT|YOGYAKARTA|DKI\s+JAKARTA)/);
  if (m) return toTitleCase(m[1].trim());
  return 'TIDAK ADA';
}

function toTitleCase(str) {
  return str.toLowerCase().replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

function renderCards() {
  var container = document.getElementById('cardsContainer');
  var empty = document.getElementById('emptyState');
  if (filteredData.length === 0) {
    container.innerHTML = '';
    container.appendChild(empty);
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = '';

  filteredData.forEach(function(item, idx) {
    var card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (idx * 0.03) + 's';
    var fallbackText = fallbackFormat(item);
    var safeFallback = escapeJsString(fallbackText);

    card.innerHTML =
      '<div class="card-header">' +
        '<div>' +
          '<div class="card-title">' + escapeHtml(item.Nama) + '</div>' +
          '<div class="card-sub">' + escapeHtml(item.KPJ) + ' &bull; ' + escapeHtml(item.NIK) + '</div>' +
        '</div>' +
        '<div class="card-badge badge-blue">Valid</div>' +
      '</div>' +
      '<div class="card-body">' +
        '<div class="field full">' +
          '<span class="field-label">Alamat</span>' +
          '<span class="field-value"><span class="kabupaten-tag">' + escapeHtml(item.Alamat) + '</span></span>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">NIK</span>' +
          '<div class="copy-row">' +
            '<span class="field-value">' + escapeHtml(item.NIK) + '</span>' +
            '<button class="copy-btn" onclick="copyText(\'' + escapeJsString(item.NIK) + '\', this)">Salin</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">KPJ</span>' +
          '<div class="copy-row">' +
            '<span class="field-value">' + escapeHtml(item.KPJ) + '</span>' +
            '<button class="copy-btn" onclick="copyText(\'' + escapeJsString(item.KPJ) + '\', this)">Salin</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">Nama</span>' +
          '<div class="copy-row">' +
            '<span class="field-value">' + escapeHtml(item.Nama) + '</span>' +
            '<button class="copy-btn" onclick="copyText(\'' + escapeJsString(item.Nama) + '\', this)">Salin</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">Tanggal Lahir</span>' +
          '<div class="copy-row">' +
            '<span class="field-value">' + escapeHtml(item['Tanggal Lahir']) + '</span>' +
            '<button class="copy-btn" onclick="copyText(\'' + escapeJsString(item['Tanggal Lahir']) + '\', this)">Salin</button>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">Total Saldo</span>' +
          '<span class="field-value large">' + escapeHtml(item['Total Saldo'] || '-') + '</span>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">Jumlah Kartu</span>' +
          '<span class="field-value">' + escapeHtml(item['Jumlah Kartu'] || '-') + '</span>' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label">Status LASIK</span>' +
          '<span class="field-value"><span class="kabupaten-tag" style="background:#d1f2e1;color:#198754;">' + escapeHtml(item['Status LASIK']) + '</span></span>' +
        '</div>' +
        '<div class="field full">' +
          '<span class="field-label">Detail LASIK</span>' +
          '<span class="field-value" style="font-size:12px;color:var(--gray);">' + escapeHtml(item['Detail LASIK']) + '</span>' +
        '</div>' +
        '<div class="field full">' +
          '<span class="field-label">Jamsostek Mobile</span>' +
          '<span class="field-value" style="font-size:12px;color:var(--gray);">' + escapeHtml(item['Jamsostek Mobile']) + '</span>' +
        '</div>' +
        '<div class="fallback-section">' +
          '<button class="fallback-btn-card" onclick="copyFallback(this, \'' + safeFallback + '\')">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>' +
              '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>' +
            '</svg>' +
            'Salin Semua Data' +
          '</button>' +
        '</div>' +
      '</div>';
    container.appendChild(card);
  });
}

function fallbackFormat(item) {
  return '*' + item.Alamat + '*\n' + item.NIK + '\n' + item['Jenis Identitas'] + '\n' + item['Tanggal Lahir'] + '\n' + item['Total Saldo'] + '\n' + (item.Perusahaan || '-') + '\n' + (item['Tanggal Nonaktif'] || '-') + '\n' + item.KPJ + '\n' + item.Nama;
}

function copyFallback(btn, text) {
  navigator.clipboard.writeText(text).then(function() {
    btn.classList.add('copied');
    var originalHTML = btn.innerHTML;
    btn.innerHTML =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<polyline points="20 6 9 17 4 12"/>' +
      '</svg>' +
      'Tersalin!';
    showToast('Data berhasil disalin');
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.innerHTML = originalHTML;
    }, 2000);
  });
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(function() {
    btn.classList.add('copied');
    btn.textContent = 'Tersalin';
    showToast('Tersalin: ' + text);
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.textContent = 'Salin';
    }, 1500);
  });
}

function filterData() {
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) {
    filteredData = allData.slice();
  } else {
    filteredData = allData.filter(function(d) {
      return (d.Nama || '').toLowerCase().indexOf(q) !== -1 ||
             (d.NIK || '').indexOf(q) !== -1 ||
             (d.KPJ || '').indexOf(q) !== -1 ||
             (d.Alamat || '').toLowerCase().indexOf(q) !== -1;
    });
  }
  applySort();
  renderCards();
}

function toggleSort() {
  sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
  document.getElementById('sortLabel').textContent = sortOrder === 'desc' ? 'Terbaru' : 'Terlama';
  applySort();
  renderCards();
}

function applySort() {
  filteredData.sort(function(a, b) {
    return sortOrder === 'desc' ? b._timestamp - a._timestamp : a._timestamp - b._timestamp;
  });
}

function updateStats() {
  document.getElementById('statTotal').textContent = allData.length;
  document.getElementById('statValid').textContent = allData.length;
  document.getElementById('statDup').textContent = dupRemovedCount;
  if (allData.length > 0) {
    document.getElementById('statsRow').style.display = 'flex';
    document.getElementById('pillTotal').textContent = allData.length + dupRemovedCount;
    document.getElementById('pillValid').textContent = allData.length;
    document.getElementById('pillDup').textContent = dupRemovedCount;
    document.getElementById('pillRemoved').textContent = dupRemovedCount;
  }
  var pct = allData.length > 0 ? 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function saveData() {
  try {
    localStorage.setItem('kpjData', JSON.stringify(allData));
    localStorage.setItem('kpjDupCount', String(dupRemovedCount));
  } catch (e) {
    console.warn('localStorage penuh atau tidak tersedia');
  }
}

function openModal(kpj) {
  var item = allData.find(function(d) { return d.KPJ === kpj; });
  if (!item) return;
  var body = document.getElementById('modalBody');
  body.innerHTML =
    '<div class="modal-item"><span class="modal-item-label">KPJ</span><span class="modal-item-value">' + escapeHtml(item.KPJ) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Nama</span><span class="modal-item-value">' + escapeHtml(item.Nama) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">NIK</span><span class="modal-item-value">' + escapeHtml(item.NIK) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Tanggal Lahir</span><span class="modal-item-value">' + escapeHtml(item['Tanggal Lahir']) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Alamat</span><span class="modal-item-value">' + escapeHtml(item.Alamat) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Total Saldo</span><span class="modal-item-value">' + escapeHtml(item['Total Saldo']) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Jumlah Kartu</span><span class="modal-item-value">' + escapeHtml(item['Jumlah Kartu']) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Status LASIK</span><span class="modal-item-value">' + escapeHtml(item['Status LASIK']) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Detail LASIK</span><span class="modal-item-value" style="font-size:12px;max-width:60%;text-align:right;">' + escapeHtml(item['Detail LASIK']) + '</span></div>' +
    '<div class="modal-item"><span class="modal-item-label">Jamsostek Mobile</span><span class="modal-item-value" style="font-size:12px;max-width:60%;text-align:right;">' + escapeHtml(item['Jamsostek Mobile']) + '</span></div>';
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
</script>
