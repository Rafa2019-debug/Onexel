<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>LASIK Data Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#64748b;--ac:#3b82f6;--ac2:#2563eb;--ok:#22c55e;--wrn:#f59e0b;--err:#ef4444;--bdr:#334155;--sh:0 4px 6px -1px rgba(0,0,0,.3);--r:12px;--rs:8px;--tr:.2s ease}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:24px}
.header{background:var(--bg2);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header-content{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-title{display:flex;align-items:center;gap:10px}
.header-icon{color:var(--ac);flex-shrink:0}
.header-title h1{font-size:1.1rem;font-weight:600;letter-spacing:-.02em}
.header-stats{font-size:.75rem;color:#60a5fa;font-weight:500;text-align:right}
.upload-section{padding:16px}
.drop-zone{background:var(--bg2);border:2px dashed var(--bdr);border-radius:var(--r);padding:32px 20px;text-align:center;cursor:pointer;transition:all var(--tr);position:relative}
.drop-zone:hover{border-color:var(--ac);background:rgba(59,130,246,.05)}
.drop-zone.dragover{border-color:var(--ac);background:rgba(59,130,246,.1);transform:scale(1.02)}
.drop-zone-content{pointer-events:none}
.drop-icon{color:var(--ac);margin-bottom:12px;opacity:.8}
.drop-title{font-size:1rem;font-weight:600;margin-bottom:4px}
.drop-subtitle{font-size:.8rem;color:#60a5fa;font-weight:500;margin-bottom:8px}
.drop-hint{font-size:.75rem;color:var(--txt3);line-height:1.6}
.controls-section{padding:0 16px 12px;display:flex;flex-direction:column;gap:12px}
.search-box{position:relative;display:flex;align-items:center}
.search-icon{position:absolute;left:12px;color:var(--txt3);pointer-events:none;z-index:2}
.search-input{width:100%;padding:10px 36px 10px 40px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);color:var(--txt);font-size:.9rem;outline:none;transition:all var(--tr);-webkit-appearance:none}
.search-input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.search-input::placeholder{color:var(--txt3)}
.search-clear{position:absolute;right:8px;background:var(--bg3);border:none;color:var(--txt2);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--tr);padding:0}
.search-clear:hover{background:var(--err);color:#fff}
.action-buttons{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:none;border-radius:var(--rs);font-size:.8rem;font-weight:600;cursor:pointer;transition:all var(--tr);white-space:nowrap;flex:1;min-width:80px}
.btn svg{flex-shrink:0}
.btn-pri{background:var(--ac);color:#fff}
.btn-pri:hover{background:var(--ac2);transform:translateY(-1px)}
.btn-sec{background:var(--bg3);color:var(--txt2)}
.btn-sec:hover{background:var(--err);color:#fff}
.progress-container{padding:0 16px 12px}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ac),#60a5fa);border-radius:3px;transition:width .3s ease;width:0%}
.progress-text{font-size:.75rem;color:var(--txt3);text-align:center}
.progress-detail{font-size:.7rem;color:var(--txt3);text-align:center;margin-top:2px;opacity:.7}
.error-log{margin:0 16px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--rs);padding:12px}
.error-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.8rem;font-weight:600;color:var(--err)}
.error-close{margin-left:auto;background:transparent;border:1px solid var(--err);color:var(--err);padding:2px 8px;border-radius:4px;font-size:.7rem;cursor:pointer}
.error-list{list-style:none;max-height:120px;overflow-y:auto}
.error-list li{font-size:.75rem;color:var(--txt2);padding:3px 0;border-bottom:1px solid rgba(239,68,68,.1)}
.error-list li:last-child{border-bottom:none}
.data-section{padding:0 16px;position:relative}
.data-list{position:relative}
.data-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh);transition:transform var(--tr),box-shadow var(--tr);will-change:transform;contain:layout style paint}
.data-card:hover{transform:translateY(-2px);box-shadow:0 8px 12px -2px rgba(0,0,0,.4);border-color:var(--ac)}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(51,65,85,.5);gap:12px}
.card-row:last-child{border-bottom:none}
.card-label{font-size:.7rem;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;min-width:100px;padding-top:2px}
.card-value{font-size:.85rem;color:var(--txt);word-break:break-word;text-align:right;flex:1;line-height:1.4}
.card-value.ok{color:var(--ok);font-weight:600}
.card-value.hl{color:#60a5fa;font-weight:500}
.card-value.money{color:var(--wrn);font-weight:600;font-family:'SF Mono',monospace}
.copy-row{align-items:center}
.btn-copy{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--bdr);color:#60a5fa;padding:3px 8px;border-radius:4px;font-size:.7rem;cursor:pointer;transition:all var(--tr);white-space:nowrap;flex-shrink:0}
.btn-copy:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn-copy:active{transform:scale(.95)}
.btn-copy-all{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bdr);color:var(--txt2);padding:6px 14px;border-radius:var(--rs);font-size:.8rem;cursor:pointer;transition:all var(--tr);width:100%;justify-content:center}
.btn-copy-all:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.loading-more{text-align:center;padding:20px;color:var(--txt3);font-size:.8rem;display:flex;align-items:center;justify-content:center;gap:10px}
.spinner{width:20px;height:20px;border:2px solid var(--bdr);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:48px 20px;color:var(--txt3)}
.empty-state svg{margin-bottom:16px;opacity:.3}
.empty-state p{font-size:.95rem;font-weight:500;margin-bottom:4px}
.empty-sub{font-size:.8rem!important;opacity:.7}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);color:var(--txt);padding:12px 24px;border-radius:var(--rs);font-size:.85rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid var(--bdr);z-index:1000;opacity:0;transition:all .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.err{border-color:var(--err);color:var(--err)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
::selection{background:rgba(59,130,246,.3);color:var(--txt)}
@media(min-width:768px){.app{max-width:700px}.header-content{padding:14px 24px}.header-title h1{font-size:1.25rem}.upload-section,.controls-section,.data-section{padding-left:24px;padding-right:24px}.drop-zone{padding:40px 24px}.data-card{padding:18px}.card-label{font-size:.75rem;min-width:120px}.card-value{font-size:.9rem}.btn{padding:10px 18px;font-size:.85rem}.search-input{padding:12px 40px 12px 44px;font-size:.95rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="header-content"><div class="header-title"><svg class="header-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><h1>LASIK Manager</h1></div><div class="header-stats" id="headerStats"></div></div></header>
<section class="upload-section"><div class="drop-zone" id="dropZone"><input type="file" id="fileInput" multiple accept=".xlsx,.xls,.csv,.txt" style="display:none"><div class="drop-zone-content"><svg class="drop-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><p class="drop-title">Unggah File</p><p class="drop-subtitle">XLSX, XLS, CSV, TXT</p><p class="drop-hint">Ketuk atau seret file ke sini</p><p class="drop-hint">Bisa banyak file sekaligus</p></div></div></section>
<section class="controls-section" id="controlsSection" style="display:none"><div class="search-box"><svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="search-input" id="searchInput" placeholder="Cari data..." autocomplete="off" autocorrect="off" autocapitalize="off"><button class="search-clear" id="searchClear" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="action-buttons"><button class="btn btn-sec" id="btnClearAll"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Hapus</button><button class="btn btn-pri" id="btnExportCSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>CSV</button><button class="btn btn-pri" id="btnExportXLSX"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>XLSX</button></div></section>
<div class="progress-container" id="progressContainer" style="display:none"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><p class="progress-text" id="progressText">Memproses...</p><p class="progress-detail" id="progressDetail"></p></div>
<div class="error-log" id="errorLog" style="display:none"><div class="error-header"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>File Gagal Diproses</span><button class="error-close" id="errorClose">Tutup</button></div><ul class="error-list" id="errorList"></ul></div>
<section class="data-section" id="dataSection"><div class="data-list" id="dataList"></div><div class="loading-more" id="loadingMore" style="display:none"><div class="spinner"></div><span>Memuat data...</span></div><div class="empty-state" id="emptyState"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><p>Belum ada data</p><p class="empty-sub">Unggah file XLSX, XLS, CSV, atau TXT</p></div></section>
</div>
<div class="toast" id="toast"></div>
<script>

// ============================================
// CONFIG
// ============================================
const CFG={
    POOL_SIZE:Math.min(Math.max((navigator.hardwareConcurrency||4)-1,2),8),
    ITEM_HEIGHT:280,VISIBLE_COUNT:15,DB_CHUNK:2000,RENDER_CHUNK:50,SEARCH_CHUNK:5000
};

// ============================================
// UTILS
// ============================================
const U={
    norm(h){return String(h||'').toLowerCase().replace(/[_\s\.\-]+/g,'').trim();},
    match(h,ps){const n=this.norm(h);return ps.some(p=>n===this.norm(p));},
    deb(fn,d){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d);};},
    esc(s){if(s==null)return'';const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;},
    fmtN(n){if(n==null)return'';const v=parseFloat(String(n).replace(/[^\d.-]/g,''));return isNaN(v)?String(n):'Rp '+v.toLocaleString('id-ID');},
    parseN(v){if(v==null)return 0;const c=String(v).replace(/[^\d.-]/g,'');const n=parseFloat(c);return isNaN(n)?0:n;},
    genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);},
    async yield(){return new Promise(r=>{if(typeof requestIdleCallback!=='undefined')requestIdleCallback(r,{timeout:50});else requestAnimationFrame(r);});}
};

// ============================================
// INDEXEDDB - INCREMENTAL WRITE (NO CLEAR!)
// ============================================
const DB={
    NAME:'LasikDB',VER:1,REC:'rec',META:'meta',db:null,
    async init(){if(this.db)return this.db;return new Promise((ok,no)=>{const r=indexedDB.open(this.NAME,this.VER);r.onerror=()=>no(r.error);r.onsuccess=()=>{this.db=r.result;ok(this.db);};r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(this.REC))d.createObjectStore(this.REC,{keyPath:'_id'});if(!d.objectStoreNames.contains(this.META))d.createObjectStore(this.META,{keyPath:'k'});};});},
    async addBatch(recs){if(!recs.length)return;const db=await this.init();const tx=db.transaction([this.REC],'readwrite');const st=tx.objectStore(this.REC);for(const r of recs)st.put({...r,_id:U.genId()});return new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);});},
    async getAll(){const db=await this.init();const tx=db.transaction([this.REC],'readonly');const st=tx.objectStore(this.REC);return new Promise((ok,no)=>{const r=st.getAll();r.onsuccess=()=>ok((r.result||[]).map(({_id,...rest})=>rest));r.onerror=()=>no(r.error);});},
    async count(){const db=await this.init();const tx=db.transaction([this.REC],'readonly');const st=tx.objectStore(this.REC);return new Promise((ok,no)=>{const r=st.count();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});},
    async clear(){const db=await this.init();const tx=db.transaction([this.REC,this.META],'readwrite');tx.objectStore(this.REC).clear();tx.objectStore(this.META).clear();return new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);});},
    async setMeta(k,v){const db=await this.init();const tx=db.transaction([this.META],'readwrite');tx.objectStore(this.META).put({k,v,t:Date.now()});return new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);});},
    async getMeta(k){const db=await this.init();const tx=db.transaction([this.META],'readonly');const st=tx.objectStore(this.META);return new Promise((ok,no)=>{const r=st.get(k);r.onsuccess=()=>ok(r.result?r.result.v:null);r.onerror=()=>no(r.error);});}
};

// ============================================
// HEADER MAPPING
// ============================================
const HMAP={
    'KPJ':['KPJ','OSS_KPJ','NO_KPJ','KPJTK','NOMOR_KPJ','NO.KPJ','KPJ_NO'],
    'NIK':['NIK','OSS_NIK','NO_KTP','NOMOR_NIK','NO.NIK','KTP','NO_KTP'],
    'NAMA':['NAMA','Nama','OSS_Nama','NAMA_OSS','NAMA_DPT','DPT_Nama','NAMA_LENGKAP','Nama_Lengkap'],
    'TANGGAL LAHIR':['TANGGAL LAHIR','TANGGAL_LAHIR','TGL_LAHIR','TGL LAHIR','OSS_Tanggal_Lahir','Tgl_Lahir','Tgl Lahir','TANGGALLAHIR'],
    'KOTA':['KOTA','KABUPATEN','DPT_Kabupaten','KAB/KOTA','KABUPATEN_KOTA','KABUPATENKOTA','KABUPATEN_KOTA'],
    'STATUS LASIK':['STATUS LASIK','LASIK_Pesan_Pengkinian','STATUS_LASIK','Status_LASIK','STATUSLASIK'],
    'DETAIL LASIK':['DETAIL LASIK','LASIK_DETAIL','LASIK_KETERANGAN','DETAIL_LASIK','DETAILLASIK','Detail_LASIK'],
    'KATEGORI':['KATEGORI','LASIK_Notif','KATEGORI_LASIK','KATEGORILASIK','Kategori'],
    'SALDO LASIK':['SALDO LASIK','LASIK_Saldo_JHT','SALDO','JHT','SALDO_JHT','SALDOJHT','LASIK_Saldo','SALDO_LASIK']
};

function detMap(hdrs){const m={};for(const[std,ps]of Object.entries(HMAP)){for(const h of hdrs){if(U.match(h,ps)){m[std]=h;break;}}}return m;}
function pStat(v){if(!v)return'';const s=String(v).toUpperCase();return s.includes('LAYAK')?'LAYAK':'';}
function pDet(v){if(!v)return'';const s=String(v);const lower=s.toLowerCase();if(!lower.includes('silahkan'))return'';if(lower.includes('mohon maaf')||lower.includes('tidak sesuai')||lower.includes('kode:')||lower.includes('data yang tidak sesuai'))return'';return s.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();}
function pKat(v){if(!v)return'';return String(v).trim().toUpperCase()==='JMO'?'JMO':'';}
function pSal(v){if(!v)return'';const n=U.parseN(v);return n>=1e6?U.fmtN(n):'';}
function xform(row,mapping){const r={};for(const[std,src]of Object.entries(mapping)){let v=row[src];switch(std){case'STATUS LASIK':r[std]=pStat(v);break;case'DETAIL LASIK':r[std]=pDet(v);break;case'KATEGORI':r[std]=pKat(v);break;case'SALDO LASIK':r[std]=pSal(v);break;default:r[std]=v!=null?String(v).trim():'';}}return r;}

// ============================================
// WEB WORKER POOL - PARALLEL PARSING
// ============================================
class WorkerPool {
    constructor(size) {
        this.size = size;
        this.queue = [];
        this.active = 0;
        this.workers = [];
        this.boot = "importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');\n\nself.onmessage = function(e) {\n    const { type, fileData, fileName, ext } = e.data;\n    try {\n        let records = [];\n        if (type === 'parse') {\n            if (ext === 'xlsx' || ext === 'xls') records = parseXLSX(fileData);\n            else if (ext === 'csv') records = parseCSV(fileData);\n            else if (ext === 'txt') records = parseTXT(fileData);\n        }\n        self.postMessage({ type: 'done', records, fileName });\n    } catch (err) {\n        self.postMessage({ type: 'error', error: err.message, fileName });\n    }\n};\n\nfunction parseXLSX(data) {\n    const XLSX = self.XLSX;\n    if (!XLSX) throw new Error('SheetJS not loaded');\n    const wb = XLSX.read(new Uint8Array(data), { type: 'array', cellDates: true });\n    const ws = wb.Sheets[wb.SheetNames[0]];\n    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });\n    if (raw.length < 2) return [];\n    const headers = raw[0].map(h => String(h || '').trim());\n    const mapping = detectHeaders(headers);\n    const out = [];\n    for (let i = 1; i < raw.length; i++) {\n        const row = {};\n        headers.forEach((h, idx) => row[h] = raw[i][idx] !== undefined ? raw[i][idx] : '');\n        out.push(transformRow(row, mapping));\n    }\n    return out;\n}\n\nfunction parseCSV(data) {\n    const text = new TextDecoder('utf-8').decode(data);\n    const lines = text.trim().split('\\n');\n    if (lines.length < 2) return [];\n    const dlm = lines[0].includes('\\t') ? '\\t' : lines[0].includes(';') ? ';' : ',';\n    const headers = parseLine(lines[0], dlm);\n    const mapping = detectHeaders(headers);\n    const out = [];\n    for (let i = 1; i < lines.length; i++) {\n        const vals = parseLine(lines[i], dlm);\n        const row = {};\n        headers.forEach((h, idx) => row[h] = vals[idx] !== undefined ? vals[idx] : '');\n        out.push(transformRow(row, mapping));\n    }\n    return out;\n}\n\nfunction parseTXT(data) {\n    const text = new TextDecoder('utf-8').decode(data);\n    const lines = text.trim().split('\\n');\n    if (lines.length < 2) return [];\n    if (lines[0].includes('\\t')) return parseCSV(data);\n    const headers = lines[0].split(/\\s{2,}/).filter(h => h.trim());\n    const mapping = detectHeaders(headers);\n    const out = [];\n    for (let i = 1; i < lines.length; i++) {\n        const vals = lines[i].split(/\\s{2,}/).filter(v => v.trim());\n        const row = {};\n        headers.forEach((h, idx) => row[h] = vals[idx] !== undefined ? vals[idx] : '');\n        out.push(transformRow(row, mapping));\n    }\n    return out;\n}\n\nfunction parseLine(line, dlm) {\n    const res = [];\n    let cur = '', q = false;\n    for (let i = 0; i < line.length; i++) {\n        const c = line[i];\n        if (c === '\"') {\n            if (q && line[i + 1] === '\"') { cur += '\"'; i++; }\n            else { q = !q; }\n        } else if (c === dlm && !q) {\n            res.push(cur.trim());\n            cur = '';\n        } else {\n            cur += c;\n        }\n    }\n    res.push(cur.trim());\n    return res;\n}\n\nfunction detectHeaders(hdrs) {\n    const m = {};\n    const MAP = {\n        'KPJ': ['KPJ', 'OSS_KPJ', 'NO_KPJ', 'KPJTK', 'NOMOR_KPJ', 'NO.KPJ', 'KPJ_NO'],\n        'NIK': ['NIK', 'OSS_NIK', 'NO_KTP', 'NOMOR_NIK', 'NO.NIK', 'KTP', 'NO_KTP'],\n        'NAMA': ['NAMA', 'Nama', 'OSS_Nama', 'NAMA_OSS', 'NAMA_DPT', 'DPT_Nama', 'NAMA_LENGKAP', 'Nama_Lengkap'],\n        'TANGGAL LAHIR': ['TANGGAL LAHIR', 'TANGGAL_LAHIR', 'TGL_LAHIR', 'TGL LAHIR', 'OSS_Tanggal_Lahir', 'Tgl_Lahir', 'Tgl Lahir', 'TANGGALLAHIR'],\n        'KOTA': ['KOTA', 'KABUPATEN', 'DPT_Kabupaten', 'KAB/KOTA', 'KABUPATEN_KOTA', 'KABUPATENKOTA', 'KABUPATEN_KOTA'],\n        'STATUS LASIK': ['STATUS LASIK', 'LASIK_Pesan_Pengkinian', 'STATUS_LASIK', 'Status_LASIK', 'STATUSLASIK'],\n        'DETAIL LASIK': ['DETAIL LASIK', 'LASIK_DETAIL', 'LASIK_KETERANGAN', 'DETAIL_LASIK', 'DETAILLASIK', 'Detail_LASIK'],\n        'KATEGORI': ['KATEGORI', 'LASIK_Notif', 'KATEGORI_LASIK', 'KATEGORILASIK', 'Kategori'],\n        'SALDO LASIK': ['SALDO LASIK', 'LASIK_Saldo_JHT', 'SALDO', 'JHT', 'SALDO_JHT', 'SALDOJHT', 'LASIK_Saldo', 'SALDO_LASIK']\n    };\n    for (const [std, ps] of Object.entries(MAP)) {\n        for (const h of hdrs) {\n            const nh = norm(h);\n            if (ps.some(p => norm(p) === nh)) { m[std] = h; break; }\n        }\n    }\n    return m;\n}\n\nfunction norm(h) {\n    return String(h || '').toLowerCase().replace(/[_\\s\\.\\-]+/g, '').trim();\n}\n\nfunction procStatus(v) {\n    if (!v) return '';\n    const s = String(v).toUpperCase();\n    return s.includes('LAYAK') ? 'LAYAK' : '';\n}\nfunction procDetail(v) {\n    if (!v) return '';\n    const s = String(v);\n    return s.toLowerCase().includes('silahkan') ? s.replace(/<[^>]*>/g, ' ').replace(/\\s+/g, ' ').trim() : '';\n}\nfunction procKat(v) {\n    if (!v) return '';\n    return String(v).trim().toUpperCase() === 'JMO' ? 'JMO' : '';\n}\nfunction procSaldo(v) {\n    if (!v) return '';\n    const n = parseFloat(String(v).replace(/[^\\d.-]/g, ''));\n    return isNaN(n) ? '' : (n >= 1e6 ? ('Rp ' + n.toLocaleString('id-ID')) : '');\n}\n\nfunction transformRow(row, mapping) {\n    const r = {};\n    for (const [std, src] of Object.entries(mapping)) {\n        let v = row[src];\n        switch (std) {\n            case 'STATUS LASIK': r[std] = procStatus(v); break;\n            case 'DETAIL LASIK': r[std] = procDetail(v); break;\n            case 'KATEGORI': r[std] = procKat(v); break;\n            case 'SALDO LASIK': r[std] = procSaldo(v); break;\n            default: r[std] = v != null ? String(v).trim() : '';\n        }\n    }\n    return r;\n}\n";
        this.init();
    }
    init() {
        for (let i = 0; i < this.size; i++) {
            const blob = new Blob([this.boot], { type: 'application/javascript' });
            const url = URL.createObjectURL(blob);
            this.workers.push({ worker: new Worker(url), busy: false });
        }
    }
    async run(fileData, fileName, ext) {
        return new Promise((resolve, reject) => {
            this.queue.push({ fileData, fileName, ext, resolve, reject });
            this.processQueue();
        });
    }
    processQueue() {
        if (!this.queue.length) return;
        const slot = this.workers.find(w => !w.busy);
        if (!slot) return;
        const task = this.queue.shift();
        slot.busy = true;
        this.active++;
        const handler = (e) => {
            slot.worker.removeEventListener('message', handler);
            slot.worker.removeEventListener('error', errorHandler);
            slot.busy = false;
            this.active--;
            if (e.data.type === 'done') task.resolve(e.data.records);
            else task.reject(new Error(e.data.error || 'Worker error'));
            setTimeout(() => this.processQueue(), 0);
        };
        const errorHandler = (e) => {
            slot.worker.removeEventListener('message', handler);
            slot.worker.removeEventListener('error', errorHandler);
            slot.busy = false;
            this.active--;
            task.reject(e);
            setTimeout(() => this.processQueue(), 0);
        };
        slot.worker.addEventListener('message', handler);
        slot.worker.addEventListener('error', errorHandler);
        slot.worker.postMessage({ type: 'parse', fileData: task.fileData, fileName: task.fileName, ext: task.ext }, [task.fileData]);
    }
    terminate() {
        this.workers.forEach(w => { w.worker.terminate(); URL.revokeObjectURL(w.worker._url); });
        this.workers = [];
    }
}

const SR={
    all:[],fil:[],q:'',busy:false,
    init(rec){this.all=rec||[];this.fil=[];this.q='';},
    async search(query){this.q=query;if(!query.trim()){this.fil=[];App.render();return;}if(this.busy)return;this.busy=true;const nq=query.toLowerCase().trim();const res=[];const CHK=5000;let idx=0;const proc=async()=>{const end=Math.min(idx+CHK,this.all.length);for(let i=idx;i<end;i++){if(this.match(this.all[i],nq))res.push(this.all[i]);}idx=end;if(idx<this.all.length){await U.yield();proc();}else{this.fil=res;this.busy=false;App.render();}};proc();},
    match(rec,query){const f=[rec.KPJ,rec.NAMA,rec.NIK,rec['TANGGAL LAHIR'],rec.KOTA,rec['STATUS LASIK'],rec['DETAIL LASIK'],rec.KATEGORI,rec['SALDO LASIK']];return f.some(v=>v&&String(v).toLowerCase().includes(query));},
    get(){return this.fil.length>0||this.q?this.fil:this.all;}
};

// ============================================
// MAIN APP
// ============================================
const App = {
    recs: [], pool: null, proc: false, rend: false, scrollOff: 0, failed: [],
    el: {},

    async init() {
        this.cacheEl();
        this.bindEv();
        await DB.init();
        await this.restore();
        // Create worker pool with size based on CPU cores
        this.pool = new WorkerPool(CFG.POOL_SIZE);
    },

    cacheEl() {
        const g = id => document.getElementById(id);
        this.el = {
            drop: g('dropZone'), file: g('fileInput'), search: g('searchInput'), clear: g('searchClear'),
            list: g('dataList'), empty: g('emptyState'), stats: g('headerStats'), ctrl: g('controlsSection'),
            prog: g('progressContainer'), fill: g('progressFill'), ptxt: g('progressText'), pdet: g('progressDetail'),
            err: g('errorLog'), errList: g('errorList'), errClose: g('errorClose'),
            toast: g('toast'), btnClr: g('btnClearAll'), btnCSV: g('btnExportCSV'), btnXLSX: g('btnExportXLSX')
        };
    },

    bindEv() {
        const {drop, file, search, clear, btnClr, btnCSV, btnXLSX, errClose} = this.el;
        drop.addEventListener('click', () => file.click());
        file.addEventListener('change', e => this.handleFiles(e.target.files));
        ['dragenter','dragover','dragleave','drop'].forEach(en => drop.addEventListener(en, e => {e.preventDefault();e.stopPropagation();}, false));
        ['dragenter','dragover'].forEach(en => drop.addEventListener(en, () => drop.classList.add('dragover'), false));
        ['dragleave','drop'].forEach(en => drop.addEventListener(en, () => drop.classList.remove('dragover'), false));
        drop.addEventListener('drop', e => this.handleFiles(e.dataTransfer.files), false);
        search.addEventListener('input', U.deb(e => {const q = e.target.value.trim(); clear.style.display = q ? 'flex' : 'none'; SR.search(q);}, 250));
        clear.addEventListener('click', () => {search.value = ''; clear.style.display = 'none'; SR.search(''); search.blur();});
        btnClr.addEventListener('click', () => this.clearAll());
        btnCSV.addEventListener('click', () => EX.csv());
        btnXLSX.addEventListener('click', () => EX.xlsx());
        errClose.addEventListener('click', () => this.el.err.style.display = 'none');
        let st; window.addEventListener('scroll', () => {if(st)clearTimeout(st); st=setTimeout(()=>this.onScroll(),16);}, {passive:true});
        document.addEventListener('click', e => {const b=e.target.closest('.btn-copy'); if(b){e.preventDefault();e.stopPropagation(); CB.copy(b.dataset.v,b.dataset.l);}});
        document.addEventListener('visibilitychange', () => {if(document.visibilityState==='hidden')this.saveState();});
        window.addEventListener('beforeunload', () => this.saveState());
    },

    async saveState() {try{await DB.setMeta('scroll',window.scrollY);await DB.setMeta('q',this.el.search.value);}catch(e){}},

    // ============================================
    // PARALLEL FILE PROCESSING WITH WORKER POOL
    // ============================================
    async handleFiles(files) {
        if(!files||!files.length||this.proc)return;
        this.proc=true; this.failed=[];
        this.el.prog.style.display='block'; this.el.err.style.display='none';

        const valid = Array.from(files).filter(f => {
            const e=f.name.split('.').pop().toLowerCase();
            return['xlsx','xls','csv','txt'].includes(e);
        });
        const total = valid.length;
        let done = 0, totalRecs = 0;

        // Launch all files in parallel via worker pool
        const promises = valid.map(file => this.processFile(file, () => {
            done++;
            this.updateProg(done, total, totalRecs);
        }));

        // Wait for all to complete (results stream in as workers finish)
        const results = await Promise.allSettled(promises);

        // Aggregate results
        for(const r of results){
            if(r.status==='fulfilled' && r.value){
                totalRecs += r.value.length;
            }
        }

        this.el.prog.style.display='none'; this.proc=false;
        if(this.failed.length) this.showErr(this.failed);

        this.updStats();
        SR.init(this.recs);
        this.render();
        this.el.file.value='';
        if(totalRecs>0) this.toast(`${totalRecs.toLocaleString('id-ID')} data berhasil dimuat`);
    },

    async processFile(file, onProgress) {
        const ext = file.name.split('.').pop().toLowerCase();
        try {
            // Read file as ArrayBuffer (main thread - fast)
            const buf = await new Promise((ok,no)=>{
                const r=new FileReader();
                r.onload=e=>ok(e.target.result);
                r.onerror=no;
                r.readAsArrayBuffer(file);
            });

            // OFFLOAD parsing to Web Worker (parallel, non-blocking)
            const records = await this.pool.run(buf, file.name, ext);

            if(records && records.length>0){
                // Append to memory immediately
                this.recs.push(...records);

                // INCREMENTAL DB write - only new data, NO clear!
                await DB.addBatch(records);

                // INCREMENTAL RENDER - show data immediately without waiting
                this.renderIncremental(records);
            }

            onProgress();
            return records;
        } catch(err) {
            this.failed.push({name:file.name, error:err.message});
            onProgress();
            return [];
        }
    },

    updateProg(cur,tot,cum){
        const pct=Math.round((cur/tot)*100);
        this.el.fill.style.width=pct+'%';
        this.el.ptxt.textContent=`Memproses ${cur}/${tot} file (${pct}%)`;
        this.el.pdet.textContent=`${this.recs.length.toLocaleString('id-ID')} data ditemukan`;
    },

    showErr(errs){
        this.el.errList.innerHTML=errs.map(f=>`<li>${U.esc(f.name)} &mdash; ${U.esc(f.error)}</li>`).join('');
        this.el.err.style.display='block';
    },

    // ============================================
    // INCREMENTAL RENDERING
    // ============================================
    renderIncremental(newRecs){
        // Don't interfere if user is searching or scrolled down
        if(window.scrollY > 100 || SR.q) return;

        const frag = document.createDocumentFragment();
        const startIdx = this.recs.length - newRecs.length;

        for(let i=0; i<newRecs.length; i++){
            const idx = startIdx + i;
            const card = this.makeCard(newRecs[i], idx);
            card.style.marginBottom = '10px';
            frag.appendChild(card);
        }

        // Append to list directly (bypass virtual scroll for incremental updates)
        const list = this.el.list;
        if(list.children.length === 0 || !list.querySelector('[style*="position:absolute"]')){
            list.appendChild(frag);
        }
        // If virtual scroll is active, just update stats - user sees on next scroll/render

        this.el.empty.style.display = 'none';
    },

    // ============================================
    // VIRTUAL SCROLLING (for large datasets)
    // ============================================
    render(){
        const rec=SR.get(); 
        if(!rec.length){
            this.el.list.innerHTML='';
            this.el.empty.style.display=this.recs.length>0?'none':'block';
            if(this.recs.length>0&&SR.q){
                this.el.list.innerHTML='<div class="empty-state"><p>Tidak ditemukan</p><p class="empty-sub">Coba kata kunci lain</p></div>';
            }
            return;
        }
        this.el.empty.style.display='none';
        const st=window.scrollY;
        const si=Math.max(0,Math.floor(st/CFG.ITEM_HEIGHT)-5);
        const ei=Math.min(rec.length,si+CFG.VISIBLE_COUNT+10);
        const th=rec.length*CFG.ITEM_HEIGHT;
        const frag=document.createDocumentFragment();
        const box=document.createElement('div'); box.style.cssText='position:relative;height:'+th+'px';
        for(let i=si;i<ei;i++){const c=this.makeCard(rec[i],i);c.style.cssText='position:absolute;top:'+(i*CFG.ITEM_HEIGHT)+'px;left:0;right:0';box.appendChild(c);}
        frag.appendChild(box); this.el.list.innerHTML=''; this.el.list.appendChild(frag); this.rend=false;
    },

    makeCard(rec,idx){
        const c=document.createElement('div'); c.className='data-card'; c.dataset.i=idx;
        let h='';
        if(rec.KPJ)h+=this.copyRow('KPJ',rec.KPJ,'KPJ');
        if(rec.NAMA)h+=this.copyRow('NAMA',rec.NAMA,'Nama');
        if(rec.NIK)h+=this.copyRow('NIK',rec.NIK,'NIK');
        if(rec['TANGGAL LAHIR'])h+=this.copyRow('TANGGAL LAHIR',rec['TANGGAL LAHIR'],'Tanggal Lahir');
        if(rec.KOTA)h+=`<div class="card-row"><span class="card-label">KOTA</span><span class="card-value">${U.esc(rec.KOTA)}</span></div>`;
        if(rec['STATUS LASIK'])h+=`<div class="card-row"><span class="card-label">STATUS LASIK</span><span class="card-value ok">${U.esc(rec['STATUS LASIK'])}</span></div>`;
        if(rec['DETAIL LASIK'])h+=`<div class="card-row"><span class="card-label">DETAIL LASIK</span><span class="card-value">${U.esc(rec['DETAIL LASIK'])}</span></div>`;
        if(rec.KATEGORI)h+=`<div class="card-row"><span class="card-label">KATEGORI</span><span class="card-value hl">${U.esc(rec.KATEGORI)}</span></div>`;
        if(rec['SALDO LASIK'])h+=`<div class="card-row"><span class="card-label">SALDO LASIK</span><span class="card-value money">${U.esc(rec['SALDO LASIK'])}</span></div>`;
        h+=`<div style="margin-top:8px;text-align:center"><button class="btn-copy-all" data-i="${idx}">Salin Semua Data</button></div>`;
        c.innerHTML=h;
        const ca=c.querySelector('.btn-copy-all');
        if(ca)ca.addEventListener('click',e=>{e.stopPropagation();CB.copyAll(rec);});
        return c;
    },

    copyRow(l,v,cl){return`<div class="card-row copy-row"><span class="card-label">${l}</span><div style="display:flex;align-items:center;gap:8px"><span class="card-value">${U.esc(v)}</span><button class="btn-copy" data-v="${U.esc(v)}" data-l="${cl}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Salin</button></div></div>`;},

    onScroll(){
        if(this.rend)return;
        const st=window.scrollY;
        if(Math.abs(st-this.scrollOff)>CFG.ITEM_HEIGHT*5){
            this.scrollOff=st; this.rend=true;
            requestAnimationFrame(()=>this.render());
        }
    },

    async restore(){
        try{
            const cnt=await DB.count();
            if(cnt>0){
                this.recs=await DB.getAll();
                this.updStats();
                const sq=await DB.getMeta('q');
                if(sq){this.el.search.value=sq;this.el.clear.style.display='flex';SR.init(this.recs);SR.search(sq);}
                else{SR.init(this.recs);this.render();}
                const ss=await DB.getMeta('scroll');
                if(ss)setTimeout(()=>window.scrollTo(0,ss),100);
            }
        }catch(e){console.error('Restore failed',e);}
    },

    updStats(){
        const c=this.recs.length;
        this.el.stats.innerHTML=c>0?`<div>${c.toLocaleString('id-ID')} data</div>`:'';
        this.el.ctrl.style.display=c>0?'flex':'none';
        this.el.empty.style.display=c>0?'none':'block';
    },

    async clearAll(){
        if(!confirm('Hapus semua data?'))return;
        this.recs=[]; SR.init([]);
        await DB.clear();
        this.el.search.value=''; this.el.clear.style.display='none';
        this.el.list.innerHTML=''; this.el.err.style.display='none';
        this.updStats(); this.toast('Semua data dihapus');
    },

    toast(m,err){
        const t=this.el.toast; t.textContent=m;
        t.className='toast show '+(err?'err':'ok');
        setTimeout(()=>t.classList.remove('show'),2500);
    }
};

// Init
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>App.init());
else App.init();
</script>
</body>
</html>
